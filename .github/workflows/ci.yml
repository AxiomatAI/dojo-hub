name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dojohub
          POSTGRES_PASSWORD: dojohub
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dojohub" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --filter './packages/*' --filter './apps/*' exec tsc -p . --noEmit
      - run: pnpm i18n:check
      - name: Unit + integration tests
        run: pnpm test
        env:
          DOJO_TEST_DATABASE_URL: postgres://dojohub:dojohub@localhost:5432/postgres
      - run: pnpm build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/dojohub --set database.url=postgres://u:p@db/dojohub
      - run: helm template ci deploy/helm/dojohub --set postgresql.enabled=true --set ingress.enabled=true > /dev/null

  e2e-compat:
    # Builds the image, runs the compose stack and installs skills with the stock `npx skills` CLI.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build image
        run: docker build -t dojohub:ci .
      - name: Compatibility test
        run: scripts/e2e-compat.sh
        env:
          DOJO_IMAGE: dojohub:ci

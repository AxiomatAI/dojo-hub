# DojoHub production-style deployment.
#   cp .env.example .env   # set DOJO_BASE_URL and DOJO_SECRET_KEY
#   docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d
# Optional S3-compatible storage: add `--profile s3` and set STORAGE_DRIVER=s3 + S3_* variables.
name: dojohub

x-dojohub: &dojohub
  image: ${DOJO_IMAGE:-ghcr.io/axiomat/dojohub:latest}
  build:
    context: ../..
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgres://${POSTGRES_USER:-dojohub}:${POSTGRES_PASSWORD:-dojohub}@postgres:5432/${POSTGRES_DB:-dojohub}
    DOJO_BASE_URL: ${DOJO_BASE_URL:-http://localhost:3000}
    DOJO_SECRET_KEY: ${DOJO_SECRET_KEY:?Set DOJO_SECRET_KEY (openssl rand -base64 48)}
    DOJO_AUTH_LOCAL: ${DOJO_AUTH_LOCAL:-true}
    DOJO_BOOTSTRAP_ADMIN_EMAIL: ${DOJO_BOOTSTRAP_ADMIN_EMAIL:-}
    DOJO_SETUP_TOKEN: ${DOJO_SETUP_TOKEN:-}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    DOJO_OSV: ${DOJO_OSV:-false}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  volumes:
    - dojohub-data:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  dojohub:
    <<: *dojohub
    command: ["server"]
    ports: ["${DOJO_PORT:-3000}:3000"]

  dojohub-worker:
    <<: *dojohub
    command: ["worker"]
    environment:
      <<: *env
      DOJO_SKIP_MIGRATIONS: "true"
    depends_on:
      dojohub:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dojohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojohub}
      POSTGRES_DB: ${POSTGRES_DB:-dojohub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dojohub}"]
      interval: 5s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dojohub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dojohub-secret}
    volumes:
      - minio-data:/data

volumes:
  dojohub-data:
  postgres-data:
  minio-data:

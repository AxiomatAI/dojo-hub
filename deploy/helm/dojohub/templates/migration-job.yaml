{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dojohub.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "dojohub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {{- include "dojohub.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "dojohub.image" . }}
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "dojohub.secretName" . }}, key: DATABASE_URL } }
            - name: DOJO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "dojohub.secretName" . }}, key: DOJO_SECRET_KEY } }
{{- end }}

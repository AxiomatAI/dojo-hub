{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "dojohub.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dojohub.fullname" . }}
  labels: {{- include "dojohub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secretKey }}
  DOJO_SECRET_KEY: {{ .Values.secretKey | quote }}
  {{- else if and $existing (index $existing.data "DOJO_SECRET_KEY") }}
  DOJO_SECRET_KEY: {{ index $existing.data "DOJO_SECRET_KEY" | b64dec | quote }}
  {{- else }}
  DOJO_SECRET_KEY: {{ randAlphaNum 64 | quote }}
  {{- end }}
  DATABASE_URL: {{ include "dojohub.databaseUrl" . | required "database.url is required (or enable postgresql)" | quote }}
  {{- with .Values.storage.s3.accessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.secretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
{{- end }}

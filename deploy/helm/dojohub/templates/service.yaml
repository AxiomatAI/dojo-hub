apiVersion: v1
kind: Service
metadata:
  name: {{ include "dojohub.fullname" . }}
  labels: {{- include "dojohub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "dojohub.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
